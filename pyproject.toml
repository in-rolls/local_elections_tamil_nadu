[project]
name = "local-elections-tamil-nadu"
version = "0.1.0"
description = "Tamil Nadu village panchayat president elections: reservations and winners, with sources and checks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Tamil Nadu", "elections", "panchayats", "village president", "reservation", "data"]
dependencies = [
    "beautifulsoup4>=4.13",
    "fonttools>=4.67.0",
    "lxml>=5",
    "pandas>=2.3",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11",
    "pillow>=11",
    "preclink>=1.2.0",
    "pyarrow>=21",
    "rapidfuzz>=3.14",
    "requests>=2.32",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_tamil_nadu"
Issues = "https://github.com/in-rolls/local_elections_tamil_nadu/issues"

[dependency-groups]
collect = ["pysocks>=1.7.1"]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_tamil_nadu"]
